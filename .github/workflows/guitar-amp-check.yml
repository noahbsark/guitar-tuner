name: Guitar amp smoke checks
on:
  pull_request:
    paths:
      - guitar-amp.html
      - guitar-amp-extras.js
      - scripts/guitar-amp-smoke.cjs
      - .github/workflows/guitar-amp-check.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/guitar-amp-smoke.cjs
