name: Publish scheduled content

on:
  schedule:
    - cron: "0 9 * * 0,1,3,5"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-content-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out live site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 0

      - name: Check out content queue
        uses: actions/checkout@v4
        with:
          ref: content-queue
          path: queue

      - name: Publish completed articles that are due
        run: python site/scripts/publish_scheduled.py --site site --queue queue

      - name: Detect published pages
        id: published
        shell: bash
        run: |
          if [[ -s site/.published-urls.txt ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit publication
        if: steps.published.outputs.changed == 'true'
        working-directory: site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sitemap.xml
          while IFS= read -r page; do
            git add -- "$page"
          done < .published-files.txt
          git commit -m "Publish scheduled guitar guides"
          git push origin main

      - name: Wait for GitHub Pages
        if: steps.published.outputs.changed == 'true'
        shell: bash
        run: |
          while IFS= read -r url; do
            ready=false
            for attempt in {1..20}; do
              if curl --fail --silent --show-error "$url" | grep --quiet 'rel="canonical"'; then
                ready=true
                break
              fi
              sleep 30
            done
            if [[ "$ready" != "true" ]]; then
              echo "::warning::GitHub Pages was not ready for $url before the IndexNow notification."
            fi
          done < site/.published-urls.txt

      - name: Notify Bing and other IndexNow search engines
        if: steps.published.outputs.changed == 'true'
        shell: bash
        run: |
          curl --fail --show-error --silent \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @site/.indexnow-payload.json \
            https://api.indexnow.org/indexnow
